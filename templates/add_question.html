{% extends "layout.html" %}

{% block head %}
<title>Add Question</title>
<style>
    form { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 1.5rem; max-width: 700px; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
    input, select, textarea {
        width: 100%;
        padding: 0.5rem 0.6rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 0.9rem;
        font-family: sans-serif;
    }
    input:focus, select:focus, textarea:focus {
        outline: 2px solid #2563eb;
        border-color: transparent;
    }
    textarea {
        resize: vertical;
        min-height: 80px;
    }
    button {
        padding: 0.55rem 1.25rem;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 0.9rem;
        cursor: pointer;
    }
    button:hover {
        background: #1d4ed8;
    }
    .results { background: #f8fafc; border: 1px solid #e2e8f0; padding: 1rem; border-radius: 4px; max-width: 560px; }
    .res-label { font-weight: bold; color: #2563eb; }

</style>
{% endblock %}

{% block content %}
<h1>Add Question</h1>

<form method="POST" action="/add_question">

    <div class="field">
        <label for="tenant_id">Tenant ID</label>
        <input type="number" id="tenant_id" name="tenant_id" required>
    </div>

    <div class="field">
        <label for="question_bank_id">Question Bank ID</label>
        <input type="number" id="question_bank_id" name="question_bank_id" required>
    </div>

    <div class="field">
        <label for="question_bank_question_id">Question Bank Question ID</label>
        <input type="number" id="question_bank_question_id" name="question_bank_question_id" required>
    </div>

    <div class="field">
        <label for="question_bank_question_topic">Topic</label>
        <input type="text" id="question_bank_question_topic" name="question_bank_question_topic" required>
    </div>

    <div class="field">
        <label for="question_bank_question_type">Question Type</label>
        <input type="text"
               id="question_bank_question_type"
               name="question_bank_question_type"
               placeholder="MCQ / True-False / Short Answer"
               required>
    </div>

    <div class="field">
        <label for="question_bank_question_text">Question Text</label>
        <textarea id="question_bank_question_text"
                  name="question_bank_question_text"
                  required></textarea>
    </div>

    <div class="field">
        <label for="question_bank_question_paragraph_text">Paragraph Text</label>
        <textarea id="question_bank_question_paragraph_text"
                  name="question_bank_question_paragraph_text"></textarea>
    </div>

    <div class="field">
        <label for="question_bank_question_difficulty">Difficulty</label>
        <select id="question_bank_question_difficulty"
                name="question_bank_question_difficulty"
                required>
            <option value="">Select difficulty</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>
    </div>

    <div class="field">
        <label for="question_bank_question_marks">Marks</label>
        <input type="number"
               step="0.5"
               id="question_bank_question_marks"
               name="question_bank_question_marks"
               required>
    </div>

    <div class="field">
        <label for="question_bank_question_negative_marks">Negative Marks</label>
        <input type="number"
               step="0.5"
               id="question_bank_question_negative_marks"
               name="question_bank_question_negative_marks"
               value="0">
    </div>

    <div class="field">
        <label for="question_bank_question_hint_text">Hint Text</label>
        <textarea id="question_bank_question_hint_text"
                  name="question_bank_question_hint_text"></textarea>
    </div>

    <div class="field">
        <label for="question_bank_question_explanation_text">Explanation Text</label>
        <textarea id="question_bank_question_explanation_text"
                  name="question_bank_question_explanation_text"></textarea>
    </div>

    <div class="field">
        <label for="question_bank_question_order">Question Order</label>
        <input type="text"
               id="question_bank_question_order"
               name="question_bank_question_order">
    </div>

    <div class="field">
        <label for="question_bank_question_parent_id">Parent Question ID</label>
        <input type="text"
               id="question_bank_question_parent_id"
               name="question_bank_question_parent_id">
    </div>

    <div class="field">
        <label for="question_bank_question_is_active">Is Active</label>
        <select id="question_bank_question_is_active"
                name="question_bank_question_is_active">
            <option value="1">True</option>
            <option value="0">False</option>
        </select>
    </div>

    <div class="field">
        <label for="question_bank_question_is_deleted">Is Deleted</label>
        <select id="question_bank_question_is_deleted"
                name="question_bank_question_is_deleted">
            <option value="0">False</option>
            <option value="1">True</option>
        </select>
    </div>

    <div class="field">
        <label for="question_bank_question_created_at">Created At</label>
        <input type="datetime-local"
               id="question_bank_question_created_at"
               name="question_bank_question_created_at"
               required>
    </div>

    <div class="field">
        <label for="question_bank_question_created_by">Created By</label>
        <input type="number"
               id="question_bank_question_created_by"
               name="question_bank_question_created_by"
               required>
    </div>

    <div class="field">
        <label for="question_bank_question_updated_at">Updated At</label>
        <input type="datetime-local"
               id="question_bank_question_updated_at"
               name="question_bank_question_updated_at"
               required>
    </div>

    <div class="field">
        <label for="question_bank_question_updated_by">Updated By</label>
        <input type="number"
               id="question_bank_question_updated_by"
               name="question_bank_question_updated_by"
               required>
    </div>

    <div class="field">
        <label for="question_bank_question_audio_url">Question Audio URL</label>
        <input type="text"
               id="question_bank_question_audio_url"
               name="question_bank_question_audio_url">
    </div>

    <div class="field">
        <label for="audio_file_url">Audio File URL</label>
        <input type="text"
               id="audio_file_url"
               name="audio_file_url">
    </div>

    <button type="submit">Add Question</button>

</form>

{% if message %}
<div class="results">
    <div class="field">
        <p><span class="res-label">Message:</span> {{ message }}</p>
    </div>
</div>
{% endif %}

{% endblock %}
