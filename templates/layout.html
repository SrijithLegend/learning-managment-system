<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f5f5f5; color: #222; padding: 2rem; }
        .container { max-width: 860px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        h2 { font-size: 1.1rem; margin: 1.5rem 0 0.75rem; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        nav { margin-bottom: 2rem; display: flex; gap: 1.5rem; border-bottom: 1px solid #ddd; padding-bottom: 0.75rem; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">Summary</a>
            <a href="/questions">All Questions</a>
            <a href="/add_question">Add Question</a>
            <a href="/update_question">Update Question</a>
            <a href="/delete_question">Delete Question</a>
            <a href="/prediction">Prediction</a>
            <a href="/classification">Classification</a>
            <a href="/generator">Question Generator</a>
        </nav>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
